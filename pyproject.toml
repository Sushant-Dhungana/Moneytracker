[project]
name = "arthax-backend"
version = "0.1.0"
description = "arthaX Python backend (strict API -> DB)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "psycopg[binary]>=3.2.9",
  "psycopg-pool>=3.2.3",
  "PyJWT[crypto]>=2.10.1",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "httpx>=0.28.1",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.4.1",
  "ruff>=0.12.8",
  "mypy>=1.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
